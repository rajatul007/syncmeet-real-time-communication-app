<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - SyncMeet</title>
  <meta name="description" content="Register for a new SyncMeet account to host and participate in real-time meetings." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">
  <!-- Nav Bar -->
  <header class="h-20 border-b border-slate-800/80 px-6 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      </div>
      <span class="text-xl font-bold text-white tracking-tight">Sync<span class="text-blue-500">Meet</span></span>
    </a>
    <div class="text-sm text-slate-400">
      Already have an account? <a href="/login" class="text-blue-400 hover:text-blue-300 font-medium">Sign in</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="auth-card">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white mb-2">Create your account</h1>
        <p class="text-sm text-slate-400">Start hosting meetings with high-definition audio & video</p>
      </div>

      <div id="errorAlert" class="hidden mb-6 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm flex items-center gap-3">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="errorAlertText">Registration error</span>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="Alex Morgan" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="alex@company.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters)</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
        </div>

        <button type="submit" id="submitBtn" class="w-full btn-primary py-3 text-base mt-2 shadow-lg shadow-blue-600/30">
          <span>Create Account</span>
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { registerUser, redirectIfAuthenticated } from '/js/auth.js';
    import { showToast } from '/js/api.js';

    redirectIfAuthenticated();

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorAlertText = document.getElementById('errorAlertText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorAlertText.textContent = 'Passwords do not match.';
        errorAlert.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Creating account...</span>';

      try {
        await registerUser(name, email, password, confirmPassword);
        showToast('Account registered successfully! Welcome to SyncMeet.', 'success');
        window.location.href = '/dashboard';
      } catch (err) {
        errorAlertText.textContent = err.message || 'Registration failed. Please try again.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Create Account</span>';
      }
    });
  </script>
</body>
</html>
